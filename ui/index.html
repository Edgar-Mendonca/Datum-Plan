<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum Plan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top">
  <div class="bar">
    <div class="qat">
      <img src="logo.svg" alt="" class="logo">
      <button data-a="save" title="Save (Ctrl+S)"><svg><use href="#i-save"/></svg></button>
      <button data-a="undo" title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
      <button data-a="redo" title="Redo (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
    </div>
    <div id="title">Datum Plan</div>
    <button id="search" data-a="palette" title="Search commands and tasks (Ctrl+K)"><svg><use href="#i-search"/></svg><span>Search or run a command</span><kbd>Ctrl+K</kbd></button>
    <button id="updBadge" hidden data-a="home">Update available</button>
  </div>
  <nav id="tabs">
    <button data-tab="file" class="file">File</button>
    <button data-tab="task" class="on">Task</button>
    <button data-tab="resource">Resource</button>
    <button data-tab="project">Project</button>
    <button data-tab="view">View</button>
    <button data-tab="help">Help</button>
  </nav>
</header>
<section id="ribbon"></section>
<main id="work">
  <nav id="views"></nav>
  <div id="ganttView">
    <div id="tlWrap"><canvas id="tl"></canvas></div>
    <div id="gmain">
      <div id="grid">
        <div id="ghead"></div>
        <div id="gbody" tabindex="0"><div id="gspace"></div><div id="grows"></div></div>
      </div>
      <div id="split"></div>
      <div id="chart">
        <canvas id="scale"></canvas>
        <div id="cwrap"><div id="cbody"><div id="cspace"></div></div><canvas id="bars"></canvas></div>
      </div>
    </div>
    <div id="dsplit"></div>
    <section id="details"></section>
  </div>
  <section id="page" hidden></section>
</main>
<footer id="status">
  <span id="stMsg">Ready</span><button id="stMode" title="New tasks: click to switch between auto and manual scheduling"></button><span id="stInfo"></span><span class="grow"></span>
  <button data-a="zout" title="Zoom out">−</button><input id="zoom" type="range" min="0" max="100"><button data-a="zin" title="Zoom in">+</button>
</footer>
<div id="bs" hidden>
  <aside>
    <button data-b="back" class="back">&larr;</button>
    <button data-b="home" class="on"><svg><use href="#i-home"/></svg>Home</button>
    <button data-b="new"><svg><use href="#i-new"/></svg>New</button>
    <button data-b="open"><svg><use href="#i-open"/></svg>Open</button>
    <button data-b="import"><svg><use href="#i-import"/></svg>Import</button>
    <button data-b="save"><svg><use href="#i-save"/></svg>Save</button>
    <button data-b="saveas"><svg><use href="#i-save"/></svg>Save As</button>
    <button data-b="export"><svg><use href="#i-export"/></svg>Export</button>
    <button data-b="print"><svg><use href="#i-print"/></svg>Print</button>
    <span class="grow"></span>
    <button data-b="options"><svg><use href="#i-opts"/></svg>Options</button>
    <button data-b="about"><svg><use href="#i-upd"/></svg>About &amp; Updates</button>
  </aside>
  <section id="bsMain"></section>
</div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
