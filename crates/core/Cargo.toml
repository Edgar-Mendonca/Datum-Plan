[package]
name = "datum-core"
version = "0.9.7"
license = "MIT"
edition = "2021"
description = "Datum Plan scheduling engine: model, calendars, CPM, parsing, edit operations."

[dependencies]
calamine = { version = "0.38.0", default-features = false }
# Already in calamine's tree: used to measure .xls and .ods sheets before calamine builds them.
cfb = "0.14.0"
quick-xml = "0.42.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
chrono.workspace = true
spellbook = "0.4.2"
rust_xlsxwriter = { version = "0.101.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
# Spreadsheet formula engine (MIT OR Apache-2.0, https://github.com/storytold/gridcraft), pinned.
gridcraft-calc = { git = "https://github.com/storytold/gridcraft", rev = "10bec74810c55c73fda2f08393ad45238eb783b5" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", rev = "10bec74810c55c73fda2f08393ad45238eb783b5" }
gridcraft-core = { git = "https://github.com/storytold/gridcraft", rev = "10bec74810c55c73fda2f08393ad45238eb783b5" }
gridcraft-functions = { git = "https://github.com/storytold/gridcraft", rev = "10bec74810c55c73fda2f08393ad45238eb783b5" }
gridcraft-numfmt = { git = "https://github.com/storytold/gridcraft", rev = "10bec74810c55c73fda2f08393ad45238eb783b5" }
gridcraft-formula = { git = "https://github.com/storytold/gridcraft", rev = "10bec74810c55c73fda2f08393ad45238eb783b5" }
